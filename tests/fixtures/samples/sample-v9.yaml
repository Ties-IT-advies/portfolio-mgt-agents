# Sample: strong v9 — volledig ingevuld idee met maatstaven, individuele sponsor en drie gemitigeerde risico's (v9 template).
version: v9
name: sample
locale: nl
project_name: "Slim Voorraadbeheer"
header:
  prepared_by: "K. van der Berg, Projectleider"
  date: "2024-03-01"
  status: "Concept"
body:
  background: "Het huidige voorraadbeheer van Verbogen BV verloopt volledig handmatig via Excel-sheets, wat leidt tot structurele over- en ondervoorraad. Jaarlijks kost dit circa €120.000 aan afschrijvingen en noodleveringen. Een slim voorraadbeheerssysteem met automatische herbestelling elimineert de hoofdoorzaak."
  objective: "Doel: voorraadbrekken met meer dan 10% afschrijving terugbrengen naar nul binnen 12 maanden na go-live. Succesmaatstaf: gemiddeld voorraadniveau gedaald met 20%, noodleveringen afgenomen met 90%."
  sponsor: "P. Jansen, Directeur Operaties"
  people_involved: "Project Manager: T. Visser (IT). Inhoudelijk expert: W. Mols (Logistiek). Inhoudelijk eindverantwoordelijke: W. Mols."
  costs: "Interne capaciteit: 480 uur over 8 maanden (IT-analist + logistiek adviseur). Projectkosten: €65.000 realisatie, €10.000/jaar onderhoud. Aanname: SaaS-licentie voorraadbeheer €18.000/jaar."
  budget: "€83.000 beschikbaar vanuit het operationeel verbeterfonds. Goedkeuring CFO ontvangen 15-02-2024."
  benefits: "€120.000/jaar besparing op afschrijvingen en noodleveringen. Doorlooptijd bestellingen gereduceerd met 30%. Nadeel: initieel weerstand vanuit Logistiek bij overgang van Excel."
  timelines: "Start: april 2024. Mijlpalen: systeemkeuze mei 2024, implementatie augustus 2024, go-live oktober 2024. Vertrouwensniveau: gemiddeld — afhankelijk van leverancierskeuze."
  risks: |-
    1. Integratieprobleem met huidig ERP — mitigatie: uitgebreide technische analyse fase 1, fallback handmatige invoer; eigenaar: T. Visser.
    2. Lage adoptie logistiek team — mitigatie: trainingsprogramma + change manager ingeschakeld; eigenaar: W. Mols.
    3. Data-kwaliteitsproblemen bij migratie — mitigatie: datakwaliteitsaudit voor go-live; eigenaar: T. Visser.
