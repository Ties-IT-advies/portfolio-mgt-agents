fields:
  - id: prepared_by
    section: header
    versions: [v9, v12]

  - id: date
    section: header
    versions: [v9, v12]

  - id: status
    section: header
    versions: [v9, v12]

  - id: background
    section: body
    versions: [v9, v12]
    guidance: Describe the background and reason for the project. What problem or opportunity is being addressed?

  - id: objective
    section: body
    versions: [v9, v12]
    guidance: What is the project objective? How will success be measured?

  - id: sponsor
    section: body
    versions: [v9, v12]
    guidance: Who is the (intended) project sponsor and ultimately responsible for this project?

  - id: people_involved
    section: body
    versions: [v9, v12]
    guidance: If known — who is the Project Manager? Which subject-matter experts are involved? Can a single content owner be named, and if so, who?

  - id: costs
    section: body
    versions: [v9, v12]
    guidance: What costs are associated with the project? Cover internal capacity, project costs including realization costs, maintenance costs, and where applicable, licence costs.

  - id: budget
    section: body
    versions: [v9, v12]
    guidance: Is budget available for this project, and what is its source?

  - id: benefits
    section: body
    versions: [v9, v12]
    guidance: What benefits will the project deliver and how can they be measured? Are there any disadvantages?

  - id: timelines
    section: body
    versions: [v9, v12]
    guidance: What is the intended timeline? What are the key milestones?

  - id: risks
    section: body
    versions: [v9, v12]
    guidance: What are the key risks? What mitigation options exist? How will risks be managed during the project, and who is responsible?

  - id: strategic_contribution
    section: body
    versions: [v12]
    guidance: Tick each strategic objective this project contributes to and add a brief explanation per ticked objective. The objective list lives in locales under fields.strategic_contribution.objectives.

  - id: departments_involved
    section: body
    versions: [v12]
    guidance: Which departments are involved in or affected by this project?

  - id: complexity
    section: body
    versions: [v12]
    guidance: How complex is this project and why? Consider technical complexity, organisational complexity, and dependencies.
